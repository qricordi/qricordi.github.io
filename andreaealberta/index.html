<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000" id="theme-meta">
    <title>Andrea & Alberta - Galleria Matrimonio</title>
    <!-- Google Fonts: Alex Brush e Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <!-- Libreria Swiper per il carosello -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background-color: #000000;
            height: 100%;
            width: 100%;
        }

        body {
            background-color: #FBF9F5; /* Sfondo bianco panna */
            color: #2C2C2C;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100dvh; /* Altezza reale visibile su smartphone senza scroll */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- 1. SCHERMATA NERA E LOGO --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #181818 0%, #000000 72%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            animation: splashFadeOut 2.2s cubic-bezier(0.4, 0, 0.2, 1) 5.8s forwards;
        }

        #splash-screen img {
            max-width: 72%;
            max-height: 200px;
            object-fit: contain;
            opacity: 0;
            animation: logoFluidAnimation 5.2s cubic-bezier(0.25, 0.1, 0.25, 1) 0.6s forwards;
        }

        @keyframes logoFluidAnimation {
            0% {
                opacity: 0;
                filter: blur(22px);
                transform: scale(0.95);
            }
            28% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.00);
            }
            65% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.025);
            }
            85% {
                opacity: 0.35;
                filter: blur(12px);
                transform: scale(1.04);
            }
            100% {
                opacity: 0;
                filter: blur(24px);
                transform: scale(1.05);
            }
        }

        @keyframes splashFadeOut {
            0% {
                opacity: 1;
                visibility: visible;
            }
            100% {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        /* --- 2. INTESTAZIONE --- */
        header {
            text-align: center;
            padding: 16px 8px 4px;
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Alex Brush', cursive;
            /* Nome su un unico rigo ingrandito quasi fino ai bordi */
            font-size: clamp(2.4rem, 10.2vw, 4.1rem);
            white-space: nowrap;
            color: #3A3532;
            font-weight: normal;
            opacity: 0;
            animation: cinematicNameReveal 2.4s cubic-bezier(0.16, 1, 0.3, 1) 7.4s forwards;
        }

        @keyframes cinematicNameReveal {
            0% {
                opacity: 0;
                letter-spacing: -3px;
                transform: translateY(14px);
            }
            60% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                letter-spacing: 0.5px;
                transform: translateY(0);
            }
        }

        header p {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3.5px;
            color: #8C857B;
            margin-top: 4px;
            opacity: 0;
            animation: slowFadeRise 2.2s cubic-bezier(0.22, 1, 0.36, 1) 8.6s forwards;
        }

        /* --- 3. CAROSELLO FOTOGRAFICO E CORNICE UNIFORME --- */
        .gallery-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            padding: 4px 0;
            min-height: 0;
            opacity: 0;
            animation: slowPhotoReveal 2.6s cubic-bezier(0.22, 1, 0.36, 1) 9.4s forwards;
        }

        @keyframes slowPhotoReveal {
            0% {
                opacity: 0;
                transform: scale(0.97) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .swiper {
            width: 100%;
            height: 100%;
            max-height: 64dvh;
            padding: 0 48px; /* Spazio protetto per le frecce */
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Cornice bianca uniforme (~3mm) con angoli leggermente arrotondati per ogni foto */
        .photo-card {
            background-color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.07);
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
        }

        .photo-card img {
            max-width: 100%;
            max-height: 58dvh;
            object-fit: contain;
            border-radius: 4px;
            display: block;
        }

        /* Frecce direzionali ben visibili e distanziate */
        .swiper-button-next, .swiper-button-prev {
            color: #555048;
            width: 36px;
            height: 36px;
            margin-top: -18px;
            opacity: 0.85 !important;
        }

        .swiper-button-prev {
            left: 6px;
        }

        .swiper-button-next {
            right: 6px;
        }

        .swiper-button-next::after, .swiper-button-prev::after {
            font-size: 20px;
            font-weight: 500;
        }

        /* --- 4. FOOTER --- */
        footer {
            text-align: center;
            padding: 8px 12px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #7A7268;
            letter-spacing: 2.5px;
            flex-shrink: 0;
            opacity: 0;
            animation: slowFadeRise 2s ease-out 10.6s forwards;
        }

        @keyframes slowFadeRise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Schermata Iniziale -->
    <div id="splash-screen">
        <img src="logo.png" alt="Logo Studio Fotografico">
    </div>

    <!-- Intestazione con nome su un unico rigo -->
    <header>
        <h1>Andrea &amp; Alberta</h1>
        <p>12 Settembre 2026</p>
    </header>

    <!-- Carosello Fotografico -->
    <div class="gallery-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <div class="photo-card"><img src="foto1.jpg" alt="Foto 1"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card"><img src="foto2.jpg" alt="Foto 2"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card"><img src="foto3.jpg" alt="Foto 3"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card"><img src="foto4.jpg" alt="Foto 4"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card"><img src="foto5.jpg" alt="Foto 5"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card"><img src="foto6.jpg" alt="Foto 6"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card"><img src="foto7.jpg" alt="Foto 7"></div>
                </div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>

    <footer>
        QRicordi
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        setTimeout(() => {
            document.documentElement.style.backgroundColor = '#FBF9F5';
            const metaTheme = document.getElementById('theme-meta');
            if (metaTheme) metaTheme.setAttribute('content', '#FBF9F5');
        }, 6400);

        const swiper = new Swiper(".mySwiper", {
            spaceBetween: 24,
            centeredSlides: true,
            grabCursor: true,
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });
    </script>
</body>
</html>
