<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FBF9F5" id="theme-meta">
    <title>Andrea & Alberta - Galleria Matrimonio</title>
    <!-- Google Fonts: Alex Brush e Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Libreria Swiper per la galleria -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: #FBF9F5;
            height: 100%;
            width: 100%;
        }

        body {
            background-color: #FBF9F5; /* Sfondo bianco panna */
            color: #2C2C2C;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- 1. SCHERMATA CHIARA E LOGO --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: #FBF9F5;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            animation: splashFadeOut 1.8s cubic-bezier(0.4, 0, 0.2, 1) 5.2s forwards;
        }

        #splash-screen img {
            max-width: 82%;
            max-height: 245px;
            object-fit: contain;
            opacity: 0;
            animation: logoLinearZoom 6.2s linear 0.4s forwards;
        }

        @keyframes logoLinearZoom {
            0% {
                opacity: 0;
                filter: blur(22px);
                transform: scale(0.92);
            }
            25% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(0.97);
            }
            75% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.05);
            }
            90% {
                opacity: 0.35;
                filter: blur(12px);
                transform: scale(1.085);
            }
            100% {
                opacity: 0;
                filter: blur(24px);
                transform: scale(1.10);
            }
        }

        @keyframes splashFadeOut {
            0% {
                opacity: 1;
                visibility: visible;
            }
            100% {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        /* --- 2. INTESTAZIONE: CASCATA LENTA E MORBIDA --- */
        header {
            text-align: center;
            padding: 34px 6px 4px;
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Alex Brush', cursive;
            font-size: clamp(2.8rem, 11.5vw, 4.5rem);
            white-space: nowrap;
            color: #3A3532;
            font-weight: normal;
            line-height: 1.15;
            padding: 0 8px;
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(0, 8px, 0) scale(0.985);
            will-change: opacity, filter, transform;
            animation: titleFluidIn 2.9s cubic-bezier(0.22, 1, 0.36, 1) 6.35s forwards;
        }

        @keyframes titleFluidIn {
            0% {
                opacity: 0;
                filter: blur(8px);
                transform: translate3d(0, 8px, 0) scale(0.985);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        header p {
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 3.5px;
            color: #8C857B;
            margin-top: 6px;
            opacity: 0;
            transform: translate3d(0, 8px, 0);
            will-change: opacity, transform;
            animation: fluidRise 2.2s cubic-bezier(0.22, 1, 0.36, 1) 7.25s forwards;
        }

        /* --- 3. GALLERIA FOTOGRAFICA --- */
        .gallery-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            padding: 4px 0;
            min-height: 0;
        }

        .swiper.mySwiper {
            width: 100%;
            height: 100%;
            max-height: 60dvh;
            padding: 0 48px;
            position: relative;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Cornice bianca uniforme su tutti e 4 i lati */
        .photo-card {
            background-color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.07);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
            margin: auto;
            cursor: zoom-in;
            transition: transform 0.2s ease;
            opacity: 0;
            transform: translate3d(0, 10px, 0) scale(0.988);
            will-change: opacity, transform;
            animation: photoFluidIn 2.6s cubic-bezier(0.22, 1, 0.36, 1) 7.95s forwards;
        }

        .photo-card:active {
            transform: scale(0.985);
        }

        .photo-card img {
            width: auto;
            max-width: 100%;
            height: auto;
            max-height: 55dvh;
            object-fit: contain;
            border-radius: 4px;
            display: block;
        }

        @keyframes photoFluidIn {
            0% {
                opacity: 0;
                transform: translate3d(0, 10px, 0) scale(0.988);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        /* Frecce direzionali */
        .mySwiper .swiper-button-next,
        .mySwiper .swiper-button-prev {
            color: #4A443D;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(215, 208, 196, 0.8);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            margin-top: -17px;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translate3d(0, 8px, 0);
            will-change: opacity, transform;
            transition: transform 0.2s ease, background-color 0.2s ease;
            animation: fluidRiseInteractive 1.9s cubic-bezier(0.22, 1, 0.36, 1) 8.95s forwards;
        }

        .mySwiper .swiper-button-prev {
            left: 8px;
        }

        .mySwiper .swiper-button-next {
            right: 8px;
        }

        .mySwiper .swiper-button-next::after,
        .mySwiper .swiper-button-prev::after {
            font-size: 14px;
            font-weight: 600;
        }

        .mySwiper .swiper-button-disabled {
            opacity: 0.3 !important;
        }

        /* --- 4. SEZIONE INFERIORE: TASTO "TUTTE LE FOTO" + FOOTER --- */
        .bottom-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 0px 12px 18px;
            margin-top: -6px;
            flex-shrink: 0;
        }

        .grid-btn {
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #E2DBD0;
            color: #5C554C;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 7px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.25s ease;
            opacity: 0;
            visibility: hidden;
            transform: translate3d(0, 8px, 0);
            will-change: opacity, transform;
            animation: fluidRiseInteractive 1.9s cubic-bezier(0.22, 1, 0.36, 1) 9.55s forwards;
        }

        .grid-btn:active {
            transform: scale(0.96);
            background-color: #F2EDE4;
        }

        .grid-btn svg {
            width: 13px;
            height: 13px;
            stroke: #5C554C;
        }

        footer {
            text-align: center;
            font-size: 0.88rem;
            font-weight: 500;
            color: #7A7268;
            letter-spacing: 2.5px;
            margin-top: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translate3d(0, 8px, 0);
            will-change: opacity, transform;
            animation: fluidRiseInteractive 1.9s cubic-bezier(0.22, 1, 0.36, 1) 10.15s forwards;
        }

        @keyframes fluidRise {
            0% {
                opacity: 0;
                transform: translate3d(0, 8px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        @keyframes fluidRiseInteractive {
            0% {
                opacity: 0;
                visibility: visible;
                transform: translate3d(0, 8px, 0);
                pointer-events: none;
            }
            100% {
                opacity: 1;
                visibility: visible;
                transform: translate3d(0, 0, 0);
                pointer-events: auto;
            }
        }

        /* --- 5. VISTA GRIGLIA STILE GALLERIA iOS --- */
        #grid-overlay {
            position: fixed;
            inset: 0;
            background-color: #FBF9F5;
            z-index: 50000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #grid-overlay.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid #EAE4DA;
            background-color: rgba(251, 249, 245, 0.95);
        }

        .grid-header span {
            font-family: 'Alex Brush', cursive;
            font-size: 1.9rem;
            color: #3A3532;
        }

        .close-grid-btn {
            background-color: #ffffff;
            border: 1px solid #E2DCD2;
            color: #3A3532;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .ios-grid {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            align-content: start;
        }

        .ios-grid-item {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 3px;
            background-color: #EFECE6;
            cursor: pointer;
            position: relative;
        }

        .ios-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.25s ease;
        }

        .ios-grid-item:active img {
            transform: scale(0.95);
        }

        /* --- 6. VISTA A SCHERMO INTERO SU SFONDO BIANCO PANNA --- */
        #fullscreen-overlay {
            position: fixed;
            inset: 0;
            background-color: #FBF9F5;
            z-index: 60000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #fullscreen-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .fullscreen-top-bar {
            position: absolute;
            top: calc(14px + env(safe-area-inset-top));
            left: 0;
            right: 0;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 60010;
        }

        .fullscreen-top-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-icon-btn {
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(215, 208, 196, 0.8);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
            color: #4A443D;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .back-icon-btn:active {
            transform: scale(0.92);
            background-color: #ffffff;
        }

        .back-icon-btn svg {
            width: 16px;
            height: 16px;
            stroke: #4A443D;
        }

        .share-btn {
            background-color: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(215, 208, 196, 0.85);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
            color: #4A443D;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            height: 36px;
            padding: 0 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .share-btn:active {
            transform: scale(0.95);
            background-color: #F2EDE4;
        }

        .share-btn svg {
            width: 14px;
            height: 14px;
            stroke: #4A443D;
        }

        .fullscreen-counter {
            color: #6E685F;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .share-toast {
            position: fixed;
            bottom: calc(28px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background-color: rgba(58, 53, 50, 0.92);
            color: #FBF9F5;
            font-size: 0.78rem;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 60020;
            white-space: nowrap;
        }

        .share-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .fullscreen-swiper {
            width: 100vw;
            height: 100%;
        }

        .fullscreen-swiper .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            padding: 54px 0 16px;
        }

        .fullscreen-swiper img {
            width: 100vw;
            height: auto;
            max-height: 86dvh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Schermata Iniziale Chiara con Logo -->
    <div id="splash-screen">
        <img src="logo.png" alt="Logo Studio Fotografico">
    </div>

    <!-- Intestazione con scrittura a mano -->
    <header>
        <h1>Andrea &amp; Alberta</h1>
        <p>12 Settembre 2026</p>
    </header>

    <!-- Galleria Fotografica Principale -->
    <div class="gallery-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="main-swiper-wrapper"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>

    <!-- Parte inferiore: Tasto Tutte le foto + QRicordi -->
    <div class="bottom-area">
        <button class="grid-btn" onclick="openGridView()" aria-label="Visualizza tutte le foto">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Tutte le foto
        </button>
        <footer>
            QRicordi
        </footer>
    </div>

    <!-- Vista Griglia stile Galleria iPhone -->
    <div id="grid-overlay">
        <div class="grid-header">
            <span>Andrea &amp; Alberta</span>
            <button class="close-grid-btn" onclick="closeGridView()">
                Galleria
            </button>
        </div>
        <div class="ios-grid" id="ios-grid"></div>
    </div>

    <!-- Vista a Schermo Intero su Sfondo Bianco Panna -->
    <div id="fullscreen-overlay">
        <div class="fullscreen-top-bar">
            <button class="back-icon-btn" onclick="closeFullscreen()" aria-label="Torna alla galleria">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="fullscreen-top-right">
                <span class="fullscreen-counter" id="fs-counter">1 / 7</span>
                <button class="share-btn" onclick="shareCurrentPhoto()" aria-label="Condividi foto">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                        <polyline points="16 6 12 2 8 6"></polyline>
                        <line x1="12" y1="2" x2="12" y2="15"></line>
                    </svg>
                    Condividi
                </button>
            </div>
        </div>
        <div class="swiper fullscreen-swiper" id="fsSwiper">
            <div class="swiper-wrapper" id="fs-swiper-wrapper"></div>
        </div>
        <div class="share-toast" id="share-toast">Link copiato</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // Aggiungi qui in futuro tutti i file delle foto (es. "foto8.jpg", ..., "foto150.jpg")
        const photos = [
            "foto1.jpg",
            "foto2.jpg",
            "foto3.jpg",
            "foto4.jpg",
            "foto5.jpg",
            "foto6.jpg",
            "foto7.jpg"
        ];

        const GRID_BATCH_SIZE = 24;
        let renderedGridCount = 0;

        const mainWrapper = document.getElementById("main-swiper-wrapper");
        const fsWrapper = document.getElementById("fs-swiper-wrapper");
        const iosGrid = document.getElementById("ios-grid");

        function buildSwipers() {
            photos.forEach((src, index) => {
                const loadMode = index === 0 ? "eager" : "lazy";

                const mainSlide = document.createElement("div");
                mainSlide.className = "swiper-slide";
                mainSlide.innerHTML = `
                    <div class="photo-card" onclick="openFullscreen(${index})">
                        <img src="${src}" alt="Foto ${index + 1}" loading="${loadMode}" decoding="async">
                    </div>
                `;
                mainWrapper.appendChild(mainSlide);

                const fsSlide = document.createElement("div");
                fsSlide.className = "swiper-slide";
                fsSlide.innerHTML = `
                    <img src="${src}" alt="Foto ${index + 1}" loading="lazy" decoding="async">
                `;
                fsWrapper.appendChild(fsSlide);
            });
        }

        buildSwipers();

        const swiper = new Swiper(".mySwiper", {
            slidesPerView: 1,
            spaceBetween: 30,
            centeredSlides: true,
            grabCursor: true,
            navigation: {
                nextEl: ".mySwiper .swiper-button-next",
                prevEl: ".mySwiper .swiper-button-prev",
            },
            on: {
                slideChange: function () {
                    preloadPhoto(this.activeIndex + 1);
                }
            }
        });

        const fsSwiper = new Swiper("#fsSwiper", {
            slidesPerView: 1,
            spaceBetween: 0,
            centeredSlides: true,
            observer: true,
            observeParents: true,
            on: {
                slideChange: function () {
                    updateCounter(this.activeIndex);
                    swiper.slideTo(this.activeIndex, 0);
                    preloadPhoto(this.activeIndex + 1);
                }
            }
        });

        function updateCounter(index) {
            document.getElementById('fs-counter').textContent = (index + 1) + ' / ' + photos.length;
        }

        function preloadPhoto(index) {
            if (index >= 0 && index < photos.length) {
                const img = new Image();
                img.decoding = "async";
                img.src = photos[index];
            }
        }

        function appendGridBatch(batchSize = GRID_BATCH_SIZE) {
            if (renderedGridCount >= photos.length) return;

            const end = Math.min(renderedGridCount + batchSize, photos.length);
            const fragment = document.createDocumentFragment();

            for (let i = renderedGridCount; i < end; i++) {
                const item = document.createElement("div");
                item.className = "ios-grid-item";
                item.onclick = () => selectFromGrid(i);
                item.innerHTML = `<img src="${photos[i]}" alt="Foto ${i + 1}" loading="lazy" decoding="async">`;
                fragment.appendChild(item);
            }

            iosGrid.appendChild(fragment);
            renderedGridCount = end;
        }

        iosGrid.addEventListener("scroll", () => {
            const nearBottom = iosGrid.scrollTop + iosGrid.clientHeight >= iosGrid.scrollHeight - 250;
            if (nearBottom) {
                appendGridBatch(GRID_BATCH_SIZE);
            }
        }, { passive: true });

        function openGridView() {
            if (renderedGridCount === 0) {
                appendGridBatch(GRID_BATCH_SIZE);
            }
            document.getElementById('grid-overlay').classList.add('active');
        }

        function closeGridView() {
            document.getElementById('grid-overlay').classList.remove('active');
        }

        function selectFromGrid(index) {
            closeGridView();
            swiper.slideTo(index, 0);
            openFullscreen(index);
        }

        function openFullscreen(index) {
            preloadPhoto(index);
            preloadPhoto(index + 1);
            const overlay = document.getElementById('fullscreen-overlay');
            overlay.classList.add('active');
            fsSwiper.update();
            fsSwiper.slideTo(index, 0);
            updateCounter(index);
        }

        function closeFullscreen() {
            document.getElementById('fullscreen-overlay').classList.remove('active');
        }

        function showToast(message) {
            const toast = document.getElementById('share-toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(window.shareToastTimeout);
            window.shareToastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        async function shareCurrentPhoto() {
            const index = fsSwiper.activeIndex || 0;
            const fileName = photos[index];
            const photoUrl = new URL(fileName, window.location.href).href;
            const shareTitle = "Andrea & Alberta - Foto " + (index + 1);

            if (navigator.share) {
                try {
                    const response = await fetch(photoUrl);
                    if (response.ok) {
                        const blob = await response.blob();
                        const mimeType = blob.type || "image/jpeg";
                        const file = new File([blob], fileName, { type: mimeType });

                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                title: shareTitle,
                                text: "Andrea & Alberta - 12 Settembre 2026",
                                files: [file]
                            });
                            return;
                        }
                    }
                } catch (err) {
                    if (err && err.name === "AbortError") return;
                }

                try {
                    await navigator.share({
                        title: shareTitle,
                        text: "Andrea & Alberta - 12 Settembre 2026",
                        url: photoUrl
                    });
                    return;
                } catch (err) {
                    if (err && err.name === "AbortError") return;
                }
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(photoUrl);
                    showToast("Link della foto copiato");
                    return;
                } catch (err) {}
            }

            showToast("Condivisione non supportata su questo dispositivo");
        }
    </script>
</body>
</html>
