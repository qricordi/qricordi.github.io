<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrea & Alberta - Galleria Matrimonio</title>
    <!-- Google Fonts: Montserrat per i dettagli e Great Vibes per la calligrafia -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <!-- Libreria Swiper per il carosello -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FBF9F5; /* Bianco panna chiaro */
            color: #2C2C2C;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- SCHERMATA INIZIALE CON BLUR E ZOOM (3 SECONDI) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: splashFadeOut 1s ease-in-out 2.5s forwards;
        }

        #splash-screen img {
            max-width: 75%;
            max-height: 220px;
            object-fit: contain;
            animation: logoBlurZoom 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes logoBlurZoom {
            0% {
                opacity: 0;
                filter: blur(15px);
                transform: scale(0.9);
            }
            30% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1);
            }
            70% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.05);
            }
            100% {
                opacity: 0;
                filter: blur(12px);
                transform: scale(1.1);
            }
        }

        @keyframes splashFadeOut {
            to {
                visibility: hidden;
                opacity: 0;
            }
        }

        /* --- INTESTAZIONE CON SCRITTURA CALLIGRAFICA --- */
        header {
            text-align: center;
            padding: 30px 20px 15px;
            opacity: 0;
            animation: fadeInContent 1s ease-in-out 3.2s forwards;
        }

        header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: #3A3532;
            font-weight: normal;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 2.2s steps(30, end) 3.2s forwards;
            margin: 0 auto;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        header p {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8C857B;
            margin-top: 5px;
            opacity: 0;
            animation: fadeInContent 0.8s ease-in-out 5.2s forwards;
        }

        /* --- CAROSELLO FOTOGRAFICO --- */
        .gallery-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 0 25px;
            opacity: 0;
            animation: fadeInContent 1s ease-in-out 5.5s forwards;
        }

        .swiper {
            width: 100%;
            height: 63vh;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            background-color: #ffffff;
            padding: 5px;
        }

        .swiper-button-next, .swiper-button-prev {
            color: #555555;
            transform: scale(0.65);
        }

        .swiper-pagination-bullet-active {
            background: #555555;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            color: #A0998E;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeInContent 1s ease-in-out 5.8s forwards;
        }

        @keyframes fadeInContent {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 1. Schermata Iniziale con Blur e Zoom (3 secondi) -->
    <div id="splash-screen">
        <img src="logo.png" alt="Logo Studio Fotografico">
    </div>

    <!-- 2. Intestazione con Nomi Calligrafici -->
    <header>
        <h1>Andrea &amp; Alberta</h1>
        <p>12 Settembre 2026</p>
    </header>

    <!-- 3. Carosello Fotografico -->
    <div class="gallery-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="foto1.jpg" alt="Foto 1"></div>
                <div class="swiper-slide"><img src="foto2.jpg" alt="Foto 2"></div>
                <div class="swiper-slide"><img src="foto3.jpg" alt="Foto 3"></div>
                <div class="swiper-slide"><img src="foto4.jpg" alt="Foto 4"></div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <footer>
        DEMO REALIZZATA DA QRICORDI
    </footer>

    <!-- Script Swiper -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper(".mySwiper", {
            spaceBetween: 20,
            centeredSlides: true,
            grabCursor: true,
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });
    </script>
</body>
</html>
