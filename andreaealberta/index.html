<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrea & Alberta - Galleria Matrimonio</title>
    <!-- Google Fonts: Alex Brush e Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <!-- Libreria Swiper per il carosello -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Fissa lo sfondo panna fin da subito per evitare qualsiasi sfarfallio o barra */
        html, body {
            background-color: #FBF9F5;
            color: #2C2C2C;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* --- 1. SCHERMATA NERA, BAGLIORE E LOGO FLUIDO --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Sfondo nero con un leggero bagliore soffuso al centro sotto il logo */
            background: radial-gradient(circle at center, #1c1c1c 0%, #000000 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* Scomparsa graduale dello splash screen */
            animation: splashFadeOut 1.8s cubic-bezier(0.4, 0, 0.2, 1) 6.0s forwards;
        }

        #splash-screen img {
            max-width: 75%;
            max-height: 220px;
            object-fit: contain;
            opacity: 0;
            /* Animazione logo: blur morbido, zoom e inizio dissolvenza leggermente prima della fine dello zoom */
            animation: logoFluidAnimation 6s cubic-bezier(0.25, 0.1, 0.25, 1) 0.8s forwards;
        }

        @keyframes logoFluidAnimation {
            0% {
                opacity: 0;
                filter: blur(25px);
                transform: scale(0.96);
            }
            30% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.00);
            }
            /* L'effetto zoom continua dolcemente fino al 75% */
            75% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.03);
            }
            /* La dissolvenza in uscita inizia prima che termini lo zoom, fondendosi perfettamente */
            88% {
                opacity: 0.4;
                filter: blur(10px);
                transform: scale(1.045);
            }
            100% {
                opacity: 0;
                filter: blur(20px);
                transform: scale(1.05);
            }
        }

        @keyframes splashFadeOut {
            0% {
                opacity: 1;
                visibility: visible;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* --- 2. INTESTAZIONE CON MESSA A FUOCO --- */
        header {
            text-align: center;
            padding: 35px 20px 15px;
        }

        header h1 {
            font-family: 'Alex Brush', cursive;
            font-size: 3.6rem;
            color: #3A3532;
            font-weight: normal;
            letter-spacing: 1px;
            opacity: 0;
            animation: elegantTitleReveal 2.2s cubic-bezier(0.22, 1, 0.36, 1) 7.2s forwards;
        }

        @keyframes elegantTitleReveal {
            0% {
                opacity: 0;
                filter: blur(12px);
                transform: translateY(15px) scale(0.96);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: translateY(0) scale(1);
            }
        }

        header p {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8C857B;
            margin-top: 6px;
            opacity: 0;
            animation: fadeInContent 1.4s ease-out 8.8s forwards;
        }

        /* --- 3. CAROSELLO FOTOGRAFICO --- */
        .gallery-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 0 25px;
            opacity: 0;
            animation: fadeInContent 1.5s ease-out 9.2s forwards;
        }

        .swiper {
            width: 100%;
            height: 62vh;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            background-color: #ffffff;
            padding: 5px;
        }

        .swiper-button-next, .swiper-button-prev {
            color: #555555;
            transform: scale(0.65);
        }

        .swiper-pagination-bullet-active {
            background: #555555;
        }

        /* --- 4. FOOTER --- */
        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            color: #A0998E;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeInContent 1.4s ease-out 9.5s forwards;
        }

        @keyframes fadeInContent {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Schermata Iniziale con bagliore e logo fluido -->
    <div id="splash-screen">
        <img src="logo.png" alt="Logo Studio Fotografico">
    </div>

    <!-- Intestazione -->
    <header>
        <h1>Andrea &amp; Alberta</h1>
        <p>12 Settembre 2026</p>
    </header>

    <!-- Carosello Fotografico con le 8 foto -->
    <div class="gallery-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="foto1.jpg" alt="Foto 1"></div>
                <div class="swiper-slide"><img src="foto2.jpg" alt="Foto 2"></div>
                <div class="swiper-slide"><img src="foto3.jpg" alt="Foto 3"></div>
                <div class="swiper-slide"><img src="foto4.jpg" alt="Foto 4"></div>
                <div class="swiper-slide"><img src="foto5.jpg" alt="Foto 5"></div>
                <div class="swiper-slide"><img src="foto6.jpg" alt="Foto 6"></div>
                <div class="swiper-slide"><img src="foto7.jpg" alt="Foto 7"></div>
                <div class="swiper-slide"><img src="foto8.jpg" alt="Foto 8"></div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <footer>
        DEMO REALIZZATA DA QRICORDI
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper(".mySwiper", {
            spaceBetween: 20,
            centeredSlides: true,
            grabCursor: true,
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });
    </script>
</body>
</html>
