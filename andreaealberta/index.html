<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrea & Alberta - Galleria Matrimonio</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FBF9F5; /* Bianco panna chiaro */
            color: #2C2C2C;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- 1. SCHERMATA NERA E LOGO --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* Transizione lenta da nero a bianco panna (parte a 4.8s, dura 1.8s) */
            animation: splashFadeOut 1.8s cubic-bezier(0.4, 0, 0.2, 1) 4.8s forwards;
        }

        #splash-screen img {
            max-width: 75%;
            max-height: 220px;
            object-fit: contain;
            opacity: 0;
            /* Parte dopo 1s di nero assoluto e dura 4.2s */
            animation: logoSoftReveal 4.2s ease-in-out 1s forwards;
        }

        @keyframes logoSoftReveal {
            0% {
                opacity: 0;
                filter: blur(22px);
                transform: scale(0.98);
            }
            28% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.00);
            }
            72% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.02); /* Zoom appena percepibile */
            }
            100% {
                opacity: 0;
                filter: blur(18px);
                transform: scale(1.03);
            }
        }

        @keyframes splashFadeOut {
            0% {
                opacity: 1;
                visibility: visible;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* --- 2. INTESTAZIONE CON EFFETTO SCRITTURA FLUIDO --- */
        header {
            text-align: center;
            padding: 35px 20px 15px;
        }

        .calligraphy-wrapper {
            display: inline-block;
            overflow: hidden;
        }

        header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.4rem;
            color: #3A3532;
            font-weight: normal;
            white-space: nowrap;
            padding: 0 12px; /* Evita tagli alle code delle lettere corsive */
            /* Svelamento continuo stile penna calligrafica */
            clip-path: inset(0 100% 0 0);
            animation: handwritingReveal 3s cubic-bezier(0.25, 0.1, 0.25, 1) 6.2s forwards;
        }

        @keyframes handwritingReveal {
            0% {
                clip-path: inset(0 100% 0 0);
            }
            100% {
                clip-path: inset(0 0% 0 0);
            }
        }

        header p {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8C857B;
            margin-top: 6px;
            opacity: 0;
            animation: fadeInContent 1.2s ease-out 9s forwards;
        }

        /* --- 3. CAROSELLO FOTOGRAFICO --- */
        .gallery-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 0 25px;
            opacity: 0;
            animation: fadeInContent 1.4s ease-out 9.3s forwards;
        }

        .swiper {
            width: 100%;
            height: 62vh;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            background-color: #ffffff;
            padding: 5px;
        }

        .swiper-button-next, .swiper-button-prev {
            color: #555555;
            transform: scale(0.65);
        }

        .swiper-pagination-bullet-active {
            background: #555555;
        }

        /* --- 4. FOOTER --- */
        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            color: #A0998E;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeInContent 1.2s ease-out 9.6s forwards;
        }

        @keyframes fadeInContent {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Schermata Iniziale -->
    <div id="splash-screen">
        <img src="logo.png" alt="Logo Studio Fotografico">
    </div>

    <!-- Intestazione -->
    <header>
        <div class="calligraphy-wrapper">
            <h1>Andrea &amp; Alberta</h1>
        </div>
        <p>12 Settembre 2026</p>
    </header>

    <!-- Carosello Fotografico -->
    <div class="gallery-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="foto1.jpg" alt="Foto 1"></div>
                <div class="swiper-slide"><img src="foto2.jpg" alt="Foto 2"></div>
                <div class="swiper-slide"><img src="foto3.jpg" alt="Foto 3"></div>
                <div class="swiper-slide"><img src="foto4.jpg" alt="Foto 4"></div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <footer>
        DEMO REALIZZATA DA QRICORDI
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper(".mySwiper", {
            spaceBetween: 20,
            centeredSlides: true,
            grabCursor: true,
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });
    </script>
</body>
</html>
