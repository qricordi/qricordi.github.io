<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000" id="theme-meta">
    <title>Andrea & Alberta - Galleria Matrimonio</title>
    <!-- Google Fonts: Alex Brush e Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Libreria Swiper per il carosello -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: #000000;
            height: 100%;
            width: 100%;
        }

        body {
            background-color: #FBF9F5; /* Sfondo bianco panna */
            color: #2C2C2C;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- 1. SCHERMATA NERA E LOGO --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #181818 0%, #000000 72%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            animation: splashFadeOut 2.2s cubic-bezier(0.4, 0, 0.2, 1) 5.8s forwards;
        }

        #splash-screen img {
            max-width: 72%;
            max-height: 200px;
            object-fit: contain;
            opacity: 0;
            animation: logoFluidAnimation 5.2s cubic-bezier(0.25, 0.1, 0.25, 1) 0.6s forwards;
        }

        @keyframes logoFluidAnimation {
            0% {
                opacity: 0;
                filter: blur(22px);
                transform: scale(0.95);
            }
            28% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.00);
            }
            65% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.025);
            }
            85% {
                opacity: 0.35;
                filter: blur(12px);
                transform: scale(1.04);
            }
            100% {
                opacity: 0;
                filter: blur(24px);
                transform: scale(1.05);
            }
        }

        @keyframes splashFadeOut {
            0% {
                opacity: 1;
                visibility: visible;
            }
            100% {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        /* --- 2. INTESTAZIONE --- */
        header {
            text-align: center;
            padding: 14px 8px 2px;
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Alex Brush', cursive;
            font-size: clamp(2.4rem, 10.2vw, 4.1rem);
            white-space: nowrap;
            color: #3A3532;
            font-weight: normal;
            opacity: 0;
            animation: cinematicNameReveal 2.4s cubic-bezier(0.16, 1, 0.3, 1) 7.4s forwards;
        }

        @keyframes cinematicNameReveal {
            0% {
                opacity: 0;
                letter-spacing: -3px;
                transform: translateY(14px);
            }
            60% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                letter-spacing: 0.5px;
                transform: translateY(0);
            }
        }

        header p {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3.5px;
            color: #8C857B;
            margin-top: 2px;
            opacity: 0;
            animation: slowFadeRise 2.2s cubic-bezier(0.22, 1, 0.36, 1) 8.6s forwards;
        }

        /* Tasto griglia stile iOS */
        .view-controls {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            opacity: 0;
            animation: slowFadeRise 2s ease-out 10.2s forwards;
        }

        .grid-btn {
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid #E5DFD5;
            color: #5C554C;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.25s ease;
        }

        .grid-btn:active {
            transform: scale(0.96);
            background-color: #F2EDE4;
        }

        .grid-btn svg {
            width: 13px;
            height: 13px;
            stroke: #5C554C;
        }

        /* --- 3. CAROSELLO FOTOGRAFICO E CORNICE UNIFORME --- */
        .gallery-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            padding: 4px 0;
            min-height: 0;
            opacity: 0;
            animation: slowPhotoReveal 2.6s cubic-bezier(0.22, 1, 0.36, 1) 9.4s forwards;
        }

        @keyframes slowPhotoReveal {
            0% {
                opacity: 0;
                transform: scale(0.97) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .swiper {
            width: 100%;
            height: 100%;
            max-height: 58dvh;
            padding: 0 46px;
            overflow: hidden;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-card {
            background-color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.07);
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
            cursor: zoom-in;
            transition: transform 0.2s ease;
        }

        .photo-card:active {
            transform: scale(0.985);
        }

        .photo-card img {
            max-width: 100%;
            max-height: 53dvh;
            object-fit: contain;
            border-radius: 4px;
            display: block;
        }

        .swiper-button-next, .swiper-button-prev {
            color: #4A443D;
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(220, 213, 202, 0.7);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            margin-top: -17px;
            opacity: 0 !important;
            animation: arrowsDelayedReveal 2s ease-out 11s forwards;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .swiper-button-next:active, .swiper-button-prev:active {
            transform: scale(0.92);
            background-color: #ffffff;
        }

        .swiper-button-prev {
            left: 6px;
        }

        .swiper-button-next {
            right: 6px;
        }

        .swiper-button-next::after, .swiper-button-prev::after {
            font-size: 14px;
            font-weight: 600;
        }

        @keyframes arrowsDelayedReveal {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* --- 4. FOOTER --- */
        footer {
            text-align: center;
            padding: 4px 12px 24px;
            font-size: 0.88rem;
            font-weight: 500;
            color: #7A7268;
            letter-spacing: 2.5px;
            flex-shrink: 0;
            opacity: 0;
            animation: slowFadeRise 2s ease-out 10.6s forwards;
        }

        @keyframes slowFadeRise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- 5. VISTA GRIGLIA STILE GALLERIA iOS --- */
        #grid-overlay {
            position: fixed;
            inset: 0;
            background-color: #FBF9F5;
            z-index: 50000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #grid-overlay.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid #EAE4DA;
            background-color: rgba(251, 249, 245, 0.95);
        }

        .grid-header span {
            font-family: 'Alex Brush', cursive;
            font-size: 1.9rem;
            color: #3A3532;
        }

        .close-grid-btn {
            background-color: #ffffff;
            border: 1px solid #E2DCD2;
            color: #3A3532;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .ios-grid {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            align-content: start;
        }

        .ios-grid-item {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 3px;
            background-color: #EFECE6;
            cursor: pointer;
            position: relative;
        }

        .ios-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.25s ease;
        }

        .ios-grid-item:active img {
            transform: scale(0.95);
        }

        /* --- 6. VISTA A SCHERMO INTERO (FULLSCREEN IMMERSIVO) --- */
        #fullscreen-overlay {
            position: fixed;
            inset: 0;
            background-color: #0B0B0B;
            z-index: 60000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #fullscreen-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .fullscreen-top-bar {
            position: absolute;
            top: calc(14px + env(safe-area-inset-top));
            left: 0;
            right: 0;
            padding: 0 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 60010;
        }

        /* Freccia Indietro a sinistra */
        .back-fullscreen-btn {
            background-color: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1px;
            padding: 8px 14px;
            border-radius: 22px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-fullscreen-btn:active {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .back-fullscreen-btn svg {
            width: 14px;
            height: 14px;
            stroke: #ffffff;
        }

        /* Contatore foto a destra */
        .fullscreen-counter {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .fullscreen-swiper {
            width: 100%;
            height: 100%;
        }

        .fullscreen-swiper .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 55px 0 20px; /* Azzerato il padding laterale per toccare i bordi dello schermo */
        }

        .fullscreen-swiper img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Riempie lo schermo e tocca i bordi destro e sinistro */
            border-radius: 0;
        }
    </style>
</head>
<body>

    <!-- Schermata Iniziale -->
    <div id="splash-screen">
        <img src="logo.png" alt="Logo Studio Fotografico">
    </div>

    <!-- Intestazione con nome su un unico rigo e tasto griglia -->
    <header>
        <h1>Andrea &amp; Alberta</h1>
        <p>12 Settembre 2026</p>
        <div class="view-controls">
            <button class="grid-btn" onclick="openGridView()" aria-label="Visualizza tutte le foto">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Tutte le foto
            </button>
        </div>
    </header>

    <!-- Carosello Fotografico Principale -->
    <div class="gallery-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <div class="photo-card" onclick="openFullscreen(0)"><img src="foto1.jpg" alt="Foto 1"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card" onclick="openFullscreen(1)"><img src="foto2.jpg" alt="Foto 2"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card" onclick="openFullscreen(2)"><img src="foto3.jpg" alt="Foto 3"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card" onclick="openFullscreen(3)"><img src="foto4.jpg" alt="Foto 4"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card" onclick="openFullscreen(4)"><img src="foto5.jpg" alt="Foto 5"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card" onclick="openFullscreen(5)"><img src="foto6.jpg" alt="Foto 6"></div>
                </div>
                <div class="swiper-slide">
                    <div class="photo-card" onclick="openFullscreen(6)"><img src="foto7.jpg" alt="Foto 7"></div>
                </div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>

    <footer>
        QRicordi
    </footer>

    <!-- Vista Griglia stile Galleria iPhone -->
    <div id="grid-overlay">
        <div class="grid-header">
            <span>Andrea &amp; Alberta</span>
            <button class="close-grid-btn" onclick="closeGridView()">
                ✕ Carosello
            </button>
        </div>
        <div class="ios-grid">
            <div class="ios-grid-item" onclick="selectFromGrid(0)"><img src="foto1.jpg" alt="Foto 1"></div>
            <div class="ios-grid-item" onclick="selectFromGrid(1)"><img src="foto2.jpg" alt="Foto 2"></div>
            <div class="ios-grid-item" onclick="selectFromGrid(2)"><img src="foto3.jpg" alt="Foto 3"></div>
            <div class="ios-grid-item" onclick="selectFromGrid(3)"><img src="foto4.jpg" alt="Foto 4"></div>
            <div class="ios-grid-item" onclick="selectFromGrid(4)"><img src="foto5.jpg" alt="Foto 5"></div>
            <div class="ios-grid-item" onclick="selectFromGrid(5)"><img src="foto6.jpg" alt="Foto 6"></div>
            <div class="ios-grid-item" onclick="selectFromGrid(6)"><img src="foto7.jpg" alt="Foto 7"></div>
        </div>
    </div>

    <!-- Vista a Schermo Intero (Fullscreen Immersivo) -->
    <div id="fullscreen-overlay">
        <div class="fullscreen-top-bar">
            <!-- Freccia Indietro a sinistra -->
            <button class="back-fullscreen-btn" onclick="closeFullscreen()">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Indietro
            </button>
            <!-- Contatore foto a destra -->
            <span class="fullscreen-counter" id="fs-counter">1 / 7</span>
        </div>
        <div class="swiper fullscreen-swiper" id="fsSwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="foto1.jpg" alt="Foto 1"></div>
                <div class="swiper-slide"><img src="foto2.jpg" alt="Foto 2"></div>
                <div class="swiper-slide"><img src="foto3.jpg" alt="Foto 3"></div>
                <div class="swiper-slide"><img src="foto4.jpg" alt="Foto 4"></div>
                <div class="swiper-slide"><img src="foto5.jpg" alt="Foto 5"></div>
                <div class="swiper-slide"><img src="foto6.jpg" alt="Foto 6"></div>
                <div class="swiper-slide"><img src="foto7.jpg" alt="Foto 7"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        setTimeout(() => {
            document.documentElement.style.backgroundColor = '#FBF9F5';
            const metaTheme = document.getElementById('theme-meta');
            if (metaTheme) metaTheme.setAttribute('content', '#FBF9F5');
        }, 6400);

        const swiper = new Swiper(".mySwiper", {
            slidesPerView: 1,
            spaceBetween: 30,
            centeredSlides: true,
            grabCursor: true,
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });

        const fsSwiper = new Swiper("#fsSwiper", {
            slidesPerView: 1,
            spaceBetween: 20,
            centeredSlides: true,
            on: {
                slideChange: function () {
                    updateCounter(this.activeIndex);
                    swiper.slideTo(this.activeIndex, 0);
                }
            }
        });

        function updateCounter(index) {
            document.getElementById('fs-counter').textContent = (index + 1) + ' / 7';
        }

        function openGridView() {
            document.getElementById('grid-overlay').classList.add('active');
        }

        function closeGridView() {
            document.getElementById('grid-overlay').classList.remove('active');
        }

        function selectFromGrid(index) {
            closeGridView();
            swiper.slideTo(index, 0);
            openFullscreen(index);
        }

        function openFullscreen(index) {
            fsSwiper.slideTo(index, 0);
            updateCounter(index);
            document.getElementById('fullscreen-overlay').classList.add('active');
            const metaTheme = document.getElementById('theme-meta');
            if (metaTheme) metaTheme.setAttribute('content', '#0B0B0B');
        }

        function closeFullscreen() {
            document.getElementById('fullscreen-overlay').classList.remove('active');
            const metaTheme = document.getElementById('theme-meta');
            if (metaTheme) metaTheme.setAttribute('content', '#FBF9F5');
        }
    </script>
</body>
</html>
