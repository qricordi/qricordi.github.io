<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giulia & Marco - Galleria Matrimonio</title>
    <!-- Font eleganti da Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <!-- Libreria Swiper per il carosello fluido -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #222222;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- SCHERMATA DI CARICAMENTO (SPLASH SCREEN) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }

        #splash-screen img {
            max-width: 80%;
            max-height: 250px;
            object-fit: contain;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* --- INTESTAZIONE SPOSI --- */
        header {
            text-align: center;
            padding: 35px 20px 20px;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: #1a1a1a;
        }

        header p {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #777777;
            margin-top: 6px;
        }

        /* --- CAROSELLO FOTOGRAFICO --- */
        .gallery-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 0 30px;
        }

        .swiper {
            width: 100%;
            height: 65vh;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        /* Colori controlli carosello */
        .swiper-button-next, .swiper-button-prev {
            color: #333333;
            transform: scale(0.7);
        }

        .swiper-pagination-bullet-active {
            background: #222222;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.75rem;
            color: #999999;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- 1. Splash Screen con Logo -->
    <div id="splash-screen">
        <img src="logo.jpg" alt="Logo Studio Fotografico">
    </div>

    <!-- 2. Nomi degli Sposi -->
    <header>
        <h1>Giulia &amp; Marco</h1>
        <p>12 Settembre 2026</p>
    </header>

    <!-- 3. Carosello Fotografico -->
    <div class="gallery-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <!-- Inserisci qui i nomi delle tue foto -->
                <div class="swiper-slide"><img src="foto1.jpg" alt="Foto 1"></div>
                <div class="swiper-slide"><img src="foto2.jpg" alt="Foto 2"></div>
                <div class="swiper-slide"><img src="foto3.jpg" alt="Foto 3"></div>
                <div class="swiper-slide"><img src="foto4.jpg" alt="Foto 4"></div>
            </div>
            <!-- Frecce e pallini di navigazione -->
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <footer>
        DEMO REALIZZATA DA QRICORDI
    </footer>

    <!-- Script per gestire carosello e dissolvenza logo -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // Nasconde lo splash screen dopo 2 secondi
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hidden');
            }, 2000);
        });

        // Inizializza il carosello
        const swiper = new Swiper(".mySwiper", {
            spaceBetween: 20,
            centeredSlides: true,
            grabCursor: true,
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });
    </script>
</body>
</html>
